<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a55"/>
      <stop offset="1" stop-color="#0b0d24"/>
    </linearGradient>
    <radialGradient id="pl" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb056"/>
      <stop offset="0.55" stop-color="#ff5e7e"/>
      <stop offset="1" stop-color="#7b2cbf"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <circle cx="96" cy="96" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="150" cy="440" r="4" fill="#fff" opacity="0.7"/>
  <circle cx="440" cy="420" r="5" fill="#fff" opacity="0.7"/>
  <circle cx="60" cy="300" r="3" fill="#fff" opacity="0.6"/>
  <!-- wobble marks: the planet is shaking -->
  <path d="M74 178 Q40 262 82 346" fill="none" stroke="#ffd166" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
  <path d="M120 206 Q98 262 126 318" fill="none" stroke="#ffd166" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <path d="M438 178 Q472 262 430 346" fill="none" stroke="#ffd166" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
  <path d="M392 206 Q414 262 386 318" fill="none" stroke="#ffd166" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <!-- the planet, tipped over -->
  <g transform="translate(256 278) rotate(-22)">
    <ellipse rx="196" ry="56" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="20"/>
    <circle r="120" fill="url(#pl)"/>
    <circle cx="-52" cy="-26" r="20" fill="#ff8c42" opacity="0.8"/>
    <circle cx="42" cy="44" r="28" fill="#c44bd6" opacity="0.7"/>
    <circle cx="34" cy="-56" r="15" fill="#ffd166" opacity="0.8"/>
    <path d="M-196 0 A196 56 0 0 0 196 0" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="20"/>
  </g>
  <!-- an incoming rock -->
  <path d="M352 132 L300 178" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round"/>
  <circle cx="376" cy="110" r="26" fill="#e6e6f0"/>
  <circle cx="366" cy="102" r="7" fill="#c9c9d6"/>
</svg>
